# ==========================================================================
# Testbed configuration (optical wireless positioning testbed, Cambridge)
#
# Configured ONCE per setup. Every application reads it through
# hardware.testbed.Testbed; do not duplicate these parameters in the applications.
# Units: mm, deg, s, Hz.  "" = auto-detect (where stated).
# ==========================================================================

# "real" = real device ; "sim" = simulated device (try the software without hardware).
# An application can override them (Testbed(modes={...}) or `run.py --sim`).
[modes]
gantry = "real"
mtrs = "real"
scope = "real"
sim_speedup = 4.0            # simulated devices move this many times faster

# --------------------------------------------------------------------------
# igus DLE-RG-0012-BLDC gantry (CRI protocol)
# --------------------------------------------------------------------------
[gantry]
ip = "192.168.3.11"          # iRC simulator: "127.0.0.1"
port = 3920                  # iRC simulator: 3921
# Allowed box (safety filter). Cartesian Z = -A3 (see [view] z_negative_up).
workspace_min_mm = [0.0, 0.0, -700.0]      # X, Y, Z
workspace_max_mm = [1400.0, 1400.0, 0.0]
velocity_mm_s = 50.0         # Cartesian speed of the moves
override_pct = 100.0         # global controller override (actual speed = velocity * override / 100)
acceleration_pct = 20.0      # % of the max acceleration; ignored with firmware < V14-004-1 (uses 40 %)
tolerance_mm = 1.0           # arrival: distance to the target (repeatability +/-0.5 mm)
still_speed_mm_s = 0.5       # below this speed the gantry is considered still
connect_attempts = 5         # cri_lib uses a 0.1 s connect timeout; the first attempt may fail
disable_on_exit = false      # false: motors stay enabled (an unbraked Z axis could fall)
expected_robot = "DLE-RG-0012-BLDC"
expected_versions = ["V980-14-003-3", "V980-14-004-4"]   # real robot / iRC simulator

# --------------------------------------------------------------------------
# Thorlabs MTRS (Kinesis). Home it in Kinesis, then close Kinesis before connecting.
# --------------------------------------------------------------------------
[mtrs]
rot_serial = ""              # "" = auto-detect the "MTRS Rotate" channel (e.g. "117000001")
tilt_serial = ""             # "" = auto-detect the "MTRS Tilt" channel
velocity_deg_s = 1.5         # MTRS maximum
acceleration_deg_s2 = 1.5
# LinearRange: rotation within [0, 360] without crossing 360 -> the PD cable never winds up.
rotation_mode = "LinearRange"          # LinearRange | RotationalRange | RotationalUnlimited
rotation_direction = "Quickest"        # rotational modes only: Quickest | Forwards | Reverse
tilt_target_deg = 0.0        # the motorized tilt is always kept here (the 15 deg tilt is mechanical)
tolerance_deg = 0.05         # arrival: angular error (repeatability +/-0.05 deg)
polling_ms = 50              # Kinesis internal polling period
kinesis_path = 'C:\Program Files\Thorlabs\Kinesis'

# --------------------------------------------------------------------------
# Agilent MSO-X 4154A oscilloscope (pyvisa). Its generator (WGEN) can drive an LED.
# --------------------------------------------------------------------------
[scope]
address = "USB0::0x0957::0x17BC::MY64080105::0::INSTR"
channel = 1                  # channel of the PDA100A2 photodetector
fft_function = 0             # Math function holding the FFT; 0 = first one with a visible FFT
fft_points = "MAX"           # points of the FFT trace to download
timeout_ms = 20000
led_freq_hz = "wgen"         # LED frequency for led_peak(): "wgen" (read the generator), a number, or "" (global peak)
led_freq_band_hz = 50.0      # the LED peak is searched within led_freq_hz +/- this band
fft_peak_min_hz = 1.0        # ignore DC when searching the global peak

# --------------------------------------------------------------------------
# Joint gantry + MTRS motion (Testbed.wait_pose)
# --------------------------------------------------------------------------
[motion]
arrival_hold_s = 0.3         # both within tolerance for this long = arrived
stall_time_s = 5.0           # both still without arriving for this long -> error
timeout_margin_s = 30.0      # margin over the estimated move duration
poll_s = 0.05                # arrival check period

# --------------------------------------------------------------------------
# Orientation of the views (match the physical setup)
# --------------------------------------------------------------------------
[view]
mtrs_zero_location = "N"     # where 0 deg of the MTRS is drawn: N, E, S, W
mtrs_clockwise = false       # MTRS rotation direction seen from above
z_negative_up = true         # in this setup the PD rises as Z becomes more negative:
                             # Z = -700 is the HIGHEST PD position and Z = 0 the lowest
